name: CI

on:
  push:
    branches: ["main", "fable/**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows runners otherwise use cp1252 for subprocess pipes. The CLI and
      # test fixtures are Russian UTF-8 text, so captured output can crash or
      # be decoded as mojibake before assertions run.
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Компиляция
        run: python -m compileall -q src tests .claude/skills
      - name: Формат
        run: ruff format --check src tests
      - name: Линт
        run: ruff check src tests
      - name: Тесты (включая мутационные и golden)
        run: pytest -q
      - name: Проверка конфигурации
        run: editor-team config validate
      - name: CLI — список профилей
        run: editor-team profiles

  corpus:
    name: Корпус и регрессия
    runs-on: ubuntu-latest        # полный прогон по корпусу — один раз
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Валидация корпуса
        run: editor-team corpus validate
      - name: Разбиение корпуса детерминировано
        run: editor-team corpus split --format json
      - name: Регрессия правил по корпусу
        run: python .claude/skills/hs-edit/scripts/selftest.py

  go:
    name: Go — сервис
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Формат
        run: test -z "$(gofmt -l ./go)"
      - name: Vet
        run: cd go && go vet ./...
      - name: Тесты
        run: cd go && go test ./...
      - name: Сборка
        run: cd go && go build ./...

  nlp-sidecar:
    name: Natasha/Razdel — py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Установка по lock с hashes
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r sidecars/nlp/requirements.lock
          pip install pytest ruff
      - name: Тесты и линт sidecar
        run: |
          cd sidecars/nlp
          pytest -q test_server.py
          ruff check server.py test_server.py
          ruff format --check server.py test_server.py

  eval-contract:
    name: Promptfoo — deterministic contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Provider and assertion contracts
        run: node --test evals/tests/evals.test.js
      - name: Promptfoo configuration
        run: |
          npx promptfoo validate -c evals/promptfooconfig.yaml
          npx promptfoo validate -c evals/promptfooconfig.pipeline.yaml

  docker-toolchain:
    name: Docker — Hunspell, Vale, amd64/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Multi-architecture build and real Hunspell integration test
        run: docker buildx build --platform linux/amd64,linux/arm64 --target gateway-integration .
      - name: Multi-architecture final gateway build
        run: docker buildx build --platform linux/amd64,linux/arm64 --target gateway .
      - name: Build native gateway image
        run: docker build --target gateway --tag editorteam-gateway:test .
      - name: Runtime smoke for installed tools and EditorTeam rule
        run: tests/integration/docker_toolchain.sh editorteam-gateway:test
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Standard Compose health path
        run: |
          docker compose build
          EDITOR_BIND_ADDRESS=127.0.0.1 docker compose up -d --wait
          curl --fail http://127.0.0.1:8740/health > /tmp/editorteam-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/editorteam-health.json").read_text())
          assert health["ok"] is True, health
          assert health["checks_complete"] is True, health
          assert all(state == "ok" for state in health["analyzers"].values()), health
          PY
          docker compose exec -T nlp python -c \
            'import json, urllib.request; h=json.load(urllib.request.urlopen("http://127.0.0.1:8742/health")); assert h["ok"] and h["complete"], h'
          python tests/integration/nlp_sidecar_http.py
          curl --fail --silent --show-error -X POST http://127.0.0.1:8742/analyze \
            -H "Content-Type: application/json" \
            -d '{"text":"Игрок купил существо и усилил существ на столе.","language":"ru-RU","game":"hearthstone","profile":"guide"}' \
            > /tmp/editorteam-nlp-analyze.json
          docker compose down --volumes
      - name: Бесплатный полный pipeline E2E
        run: |
          EDITOR_BIND_ADDRESS=127.0.0.1 docker compose \
            -f docker-compose.yml -f tests/integration/docker-compose.e2e.yml \
            up -d --build --wait
          python tests/integration/pipeline_e2e.py
      - name: Compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop Compose services
        if: always()
        run: |
          docker compose -f docker-compose.yml \
            -f tests/integration/docker-compose.e2e.yml \
            down --volumes --remove-orphans
