version: 1

# Игровые понятия отделены от названий карт. Это не список текущей меты:
# он нужен только для проверки того, как термин попал в текст.
entities:
  - id: poison
    aliases: [Venomous, Venom]
    kind: keyword
    preferred: "яд"
    public_form: "существо с ядом"
    explanation: "свойство, которое уничтожает первую цель после нанесения ей урона"
    public_forbidden: true
    misuse_patterns:
      - "\\b(?:купить|купите|найти|разыграть|сбросить|оставить)\\s+(?:Venomous|Venom)\\b"
      - "\\b(?:карта|карту|карты|существо|юнит)\\s+(?:Venomous|Venom)\\b"

  - id: divine-shield
    aliases: ["Divine Shield"]
    kind: keyword
    preferred: "божественный щит"
    explanation: "свойство, которое один раз блокирует урон"
    public_forbidden: true

  - id: reborn
    aliases: [Reborn]
    kind: keyword
    preferred: "перерождение"
    explanation: "свойство, которое возвращает существо после смерти с малым запасом здоровья"
    public_forbidden: true

  - id: deathrattle
    aliases: [Deathrattle]
    kind: keyword
    preferred: "предсмертный хрип"
    explanation: "эффект, который срабатывает после смерти существа"
    public_forbidden: true

  - id: taunt
    aliases: [Taunt]
    kind: keyword
    preferred: "провокация"
    explanation: "свойство, которое заставляет атаковать это существо первым"
    public_forbidden: true

  - id: dark-gifts
    aliases: ["Dark Gifts", "Dark Gift"]
    kind: system
    preferred: "Темные дары"
    public_form: "Темные дары"
    explanation: "система предложений, которая помогает выбрать направление игры"
    public_forbidden: true

profiles:
  analytics-article:
    audience: "обычный игрок Hearthstone"
    mode: public
    quality:
      thesis_required: true
      intro_paragraphs: 3
      max_paragraph_words: 90
      max_paragraph_sentences: 4
      max_sentence_commas: 3
      max_research_terms_per_paragraph: 2
      max_numeric_groups_per_paragraph: 5
    forbidden_terms:
      - id: jargon.power
        terms: [паверкрип, "power creep", powercreep, скейлинг, scaling]
        suggestion: "назвать конкретный эффект и объяснить, что он меняет в партии"
        message: "техническое слово скрывает главную мысль"
      - id: jargon.research
        terms: [выборка, выборки, выборке, выборку, выборок, "срез данных", "набор данных", методология, корреляция, корреляции, "причинный эффект", репрезентативный, репрезентативность, "данные показывают", "это не доказывает", evidence, "source breakdown"]
        density_group: research
        density_only: true
        preferred: "коротко назвать число и его вывод, а методику оставить в заметках"
        suggestion: "оставить игроку сам вывод; подробности выборки и методики вынести из основного текста"
        message: "исследовательская лексика перегружает публичную статью"
      - id: jargon.abstraction
        terms: [опциональность, доступность, распределение, распределения, мультипликатор, мультипликаторы, мультипликативный, мультипликативная, "цепочка взаимодействий"]
        suggestion: "назвать конкретное действие карты или его последствие для партии"
        message: "абстрактное слово скрывает понятное игровое действие"
      - id: jargon.data
        terms: [телеметрия, telemetry, "damage cap", solo]
        suggestion: "использовать понятное русское описание или убрать служебный термин"
        message: "служебный термин не помогает игроку понять вывод"
      - id: jargon.body
        terms: [тело]
        suggestion: "назвать существо, стол или другой конкретный объект"
        message: "слово не объясняет, о каком игровом объекте идет речь"
      - id: jargon.metaphor
        terms: [выброс, скриншот, survivorship, мультипликатив]
        suggestion: "описать действие и его результат простыми словами"
        message: "метафора или калька делает игровой вывод неясным"
      - id: terminology.dark-gifts-generic
        terms: [подарок, подарка, подарки, подарков, подарку, подарком, подарками]
        preferred: "Темные дары / Темный дар"
        suggestion: "для системы использовать «Темные дары», для одного предложения — «Темный дар»"
        message: "система Темных даров названа слишком общо"
      - id: terminology.minion-type
        terms: [племя, племени, племен, племенами, племенах, племенной, племенная, племенные, племенным, племенных, племенную]
        preferred: "тип существа / типы существ"
        suggestion: "использовать «тип существа» или «типы существ»"
        message: "«племя» — неточный термин для типа существ на Полях сражений"
    reader_contract:
      opening: "Сначала назвать, что происходит сейчас, и сразу дать практический вопрос или вывод статьи."
      paragraph: "Один абзац — одна мысль или один пример. Сначала вывод, затем короткое объяснение."
      block: "Для карты или изменения держать порядок: что делает → где полезно → ограничение или вердикт."
      evidence: "Оставлять только числа и ссылки, которые меняют вывод для игрока; методику и служебные детали убирать из основного текста."
      language: "Предпочитать конкретные карты, классы, колоды и игровые действия абстрактным словам."
    formats:
      ranking: "вступление → критерий оценки → карта: действие, применение, ограничение"
      patch: "что меняется → зачем это сделали → какие классы или колоды почувствуют эффект"
      rotation: "что уходит → какие колоды теряют → чем можно заменить или чего ждать"
      crafting: "категория карты → где она нужна → стоит ли создавать сейчас"
    thesis:
      problem_markers: ['\bпроблема\b', '\bдело\s+в\b', '\bпочему\b', '\bхуже\b', '\bважн\w*\b', '\bвопрос\b']
      consequence_markers: ['\bиз-за\s+этого\b', '\bпоэтому\b', '\bв\s+результате\b', '\bстановится\s+(?:труднее|сложнее|сильнее)\b', '\bможет\s+привести\b', '\bпоможет\b', '\bстоит\b']
      suggestion: "В начале статьи сформулировать текущую проблему, ее влияние на игру и практический вывод для читателя."
