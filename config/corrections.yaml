# Журнал правок автора: было → стало → почему. Добросовестный редактор помнит,
# за что его поправили. Заполняется командой `editor-team learn до.md после.md`
# или одной строкой `editor-team learn add "было" "стало" --reason "…"`.
#
# kind: term — слово или термин (затвор ищет его по леммам и отклоняет),
#       phrase — оборот (затвор ищет по образцу, промпт показывает как пример),
#       structure — про форму и порядок (только в промпт),
#       fact — про игровой факт (только в промпт).
