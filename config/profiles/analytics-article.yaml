id: analytics-article
title: Аналитическая статья Hearthstone
description: "Публичная аналитика для обычного игрока: конкретный вывод, понятные блоки и минимум служебных деталей"
min_words: 400
sections:
  required: []
  optional:
    # purpose — назначение раздела одной строкой: что читатель должен унести из него
    - {id: ranking, title: Рейтинг, variants: [рейтинг, топ карт, самые ожидаемые карты], min_words: 60,
       purpose: "какие карты или колоды стоят выше и за счёт чего; у каждого места одна игровая причина"}
    - {id: patch, title: Изменения патча, variants: [обзор патча, изменения патча, что изменилось], min_words: 60,
       purpose: "что поменяли в патче и что это меняет для колод, которыми играет читатель"}
    - {id: rotation, title: Ротация, variants: [ротация, что уйдет, потери колод], min_words: 60,
       purpose: "что уходит из Стандарта, какие колоды это ломает и что остаётся живым"}
    - {id: crafting, title: Крафт, variants: [крафт, что создавать, лучшие легендарные карты], min_words: 60,
       purpose: "что создавать за пыль в первую очередь и почему это не устареет через патч"}
    - {id: conclusion, title: Вывод, variants: [вывод, заключение, что это значит],
       purpose: "вывод одной-двумя фразами: что это значит для игрока; без прогнозов"}
matchups: {require_classes: false}
numbers:
  require_source: true
  note: "Число должно быть связано с патчем, датой, рангом или понятной выборкой"
analyzers: {markers: true, rhythm: true, soul: true, cards: true, structure: true, consistency: true, clarity: true}
weights: {живое: 0.25, ритм: 0.20, чистота: 0.15, названия: 0.10, согласованность: 0.10, понятность: 0.20}
note: "Нарративная аналитика, а не исследовательский отчёт: читателю нужен вывод и его игровое объяснение"
