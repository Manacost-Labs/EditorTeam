id: wow-guide
title: Гайд по классу или специализации в World of Warcraft
description: "У жанра своя структура: ротация, таланты, статы, экипировка, механики"
min_words: 500
sections:
  required:
    - {id: rotation, title: Ротация, variants: [ротация, приоритет способностей, порядок действий, билд ротации],
       min_words: 60, purpose: "порядок способностей в бою и что менять при кулдаунах"}
    - {id: talents, title: Таланты, variants: [таланты, талантовый билд, ветки талантов, билд],
       min_words: 60, purpose: "билд талантов под рейд и под подземелья, чем они различаются"}
    - {id: stats, title: Приоритет статов, variants: [приоритет статов, статы, характеристики, приоритет характеристик],
       min_words: 40, purpose: "какие характеристики важнее и почему"}
  optional:
    - {id: gear, title: Экипировка, variants: [экипировка, бис, лучшие предметы, снаряжение],
       purpose: "лучшие предметы по слотам и откуда их брать"}
    - {id: consumables, title: Расходники, variants: [расходники, зелья, еда, флаконы],
       purpose: "зелья, еда и флаконы под специализацию и когда их пить"}
    - {id: cooldowns, title: Кулдауны, variants: [кулдауны, большие кулдауны, бурст],
       purpose: "когда жать большие кулдауны и с чем их складывать"}
    - {id: mechanics, title: Механики, variants: [механики, механики боссов, особенности боёв],
       purpose: "какие механики боёв меняют ротацию и как на них отвечать"}
    - {id: macros, title: Макросы, variants: [макросы, аддоны, вейкауры],
       purpose: "макросы и аддоны, которые упрощают ротацию, и что они делают"}
    - {id: leveling, title: Прокачка, variants: [прокачка, левелинг],
       purpose: "чем качаться и что менять в билде до максимального уровня"}
matchups: {require_classes: false}
analyzers: {markers: true, rhythm: true, soul: true, cards: false, structure: true, consistency: true, clarity: false}
weights: {живое: 0.30, ритм: 0.25, чистота: 0.20, названия: 0.0, согласованность: 0.15, структура: 0.10}
note: "cards отключён: справочника русских названий WoW пока нет"
