id: meta-report
title: Мета-отчёт
description: "Обзор меты для игрока в форме гайда: что изменилось, кто лидирует и почему, что брать под свой ранг, сборки лидеров"
min_words: 1200
# Каркас — не оглавление исследовательского отчёта, а рассказ автора: от предмета
# к выбору читателя. Источник (PDF, статистика, реплеи) даёт факты, но не порядок
# разделов. Цифра называется один раз там, где она нужна для решения.
sections:
  required:
    - {id: changes, title: Что изменилось, variants: [что изменилось, новинки меты, изменения, что поменялось, что принесли наборы], min_words: 120,
       purpose: "патч и дополнение: какие карты и наборы вошли, что взлетело и что не состоялось — своими словами, без таблицы"}
    - {id: summary, title: Лидеры меты, variants: [лидеры меты, обзор меты, состояние меты, что происходит, положение сил], min_words: 150,
       purpose: "две-три колоды, которые делят вершину, и одна причина, почему выбор между ними зависит от ранга; главный матч-ап называется здесь один раз"}
    - {id: choice, title: Что брать под свой ранг, variants: [что брать под свой ранг, как выбрать колоду, что брать, выбор колоды, под свой ранг], min_words: 120,
       purpose: "совет читателю по ситуации: быстро подняться, играть в Легенде, ответить на конкретное поле; ссылка на матч-ап без повтора цифры"}
    - {id: builds, title: Сборки лидеров, variants: [сборки лидеров, сборки, топовые сборки, коды колод, сборки и муллиган], min_words: 200,
       purpose: "две-четыре рекомендуемые сборки: код, чем версия отличается, что оставлять в муллигане и как играть первые ходы; остальные коды не приводятся"}
    - {id: others, title: Остальные классы, variants: [остальные классы, остальное поле, кто ещё играет, другие классы, разбор классов], min_words: 150,
       purpose: "связный абзац на класс или группу классов: где стоит, против кого хорош, когда его брать; без оценочных букв и списков"}
  optional:
    - {id: tiers, title: Тир-лист, variants: [тир-лист, тиры, расстановка, практический рейтинг],
       purpose: "единственная таблица материала, если она нужна: колода, процент побед и число игр по рангам"}
    - {id: conclusion, title: Заключение, variants: [заключение, итог], purpose: "короткий итог и подпись; без прогнозов"}
matchups: {require_classes: false}
numbers: {require_source: true, note: "цифра без ранга, выборки и патча — не факт; цифра, названная дважды, — повтор"}
opening:
  requires: [expansion]
  formula: "Герой обзора — мета <режима> после <дополнение/патч>"
  promise: true
closing:
  signature: "Спасибо за внимание"
# форма подачи: как в гайдах автора, где таблиц нет вовсе, а кодов — по числу рекомендуемых сборок
form:
  tables_max: 1
  codes_max: 4
  repeated_facts_max: 0          # один и тот же процент не должен звучать в трёх и больше абзацах
  grade_labels: forbidden        # «Положение: A−/B+» — шкала провайдера, не голос автора
analyzers: {markers: true, rhythm: true, soul: true, cards: true, structure: true, consistency: true, clarity: false}
weights: {живое: 0.20, ритм: 0.20, чистота: 0.20, названия: 0.15, согласованность: 0.15, структура: 0.10}
