id: anti-guide
title: Антигайд по популярному архетипу
description: "Разбор проблемной колоды и способов её обыграть: контрколоды, причины преимущества и ограничения выбора"
min_words: 180
sections:
  required: []
  optional:
    - {id: target, title: Разбор противника, variants: [знайте врага в лицо, знать врага в лицо, врага надо знать в лицо, кто такой противник],
       purpose: "какая колода цель, в каком патче и за счёт чего она выигрывает"}
    - {id: counters, title: Контрколоды, variants: [контрколоды, лучшие контрколоды, чем победить, чем контрить, лучшие ответы],
       purpose: "какие колоды подходят и почему работает каждая"}
    - {id: gameplan, title: План на матч-ап, variants: [как играть против, план на матч-ап, ключи к победе, способы победы],
       purpose: "как играть против цели: муллиган, темп, чего бояться"}
    - {id: caveats, title: Ограничения выбора, variants: [ограничения, слабые стороны, другие матч-апы, что важно учесть],
       purpose: "плохие матч-апы контрколоды и когда её брать не стоит"}
matchups:
  require_classes: false
numbers:
  require_source: true
  note: "Винрейт требует ранга, выборки, патча или даты; старый антигайд не подтверждает текущую контру"
analyzers: {markers: true, rhythm: true, soul: true, cards: true, structure: true, consistency: true, clarity: false}
weights: {живое: 0.25, ритм: 0.20, чистота: 0.20, названия: 0.15, согласованность: 0.15, структура: 0.05}
note: "Калибровка: 15 антигайдов 2021–2025 годов, медиана 328 слов. Общих обязательных заголовков нет; проверять нужно логику контры, а не структуру constructed-guide"
