id: battlegrounds-guide
title: Гайд по Полям сражений
description: "У режима нет колод и муллигана: структура другая, требовать разделы конструированного гайда нельзя"
min_words: 400
sections:
  required:
    - {id: idea, title: Идея стратегии, variants: [идея стратегии, суть стратегии, как это работает, о стратегии],
       min_words: 60, purpose: "за счёт чего стратегия выигрывает и когда в неё стоит идти"}
    - {id: minions, title: Ключевые существа, variants: [ключевые существа, ключевые карты, основные существа],
       min_words: 60, purpose: "существа, без которых стратегия не работает, и что они делают на столе"}
    - {id: curve, title: План по ходам, variants: [план по ходам, по ходам, тайминги, порядок действий],
       min_words: 60, purpose: "что покупать и когда повышать таверну, ход за ходом"}
  optional:
    - {id: heroes, title: Герои, variants: [герои, подходящие герои, выбор героя],
       purpose: "герои, с которыми стратегия работает лучше, и чем их сила ей помогает"}
    - {id: trinkets, title: Аксессуары, variants: [аксессуары, безделушки, артефакты],
       purpose: "аксессуары под стратегию и на каком ходу их брать"}
    - {id: mistakes, title: Ошибки, variants: [ошибки, частые ошибки, чего не делать],
       purpose: "типичные ошибки и чем каждая стоит места в лобби"}
    - {id: final_board, title: Итоговый стол, variants: [итоговый стол, финальный стол, идеальный стол],
       purpose: "стол, к которому идёт стратегия, и что в нём можно заменить"}
    - {id: alternatives, title: Альтернативные линии, variants: [альтернативные линии, запасные планы, если не зашло],
       purpose: "куда сворачивать, если ключевые существа не пришли"}
matchups:
  require_classes: false          # в режиме нет классов, требовать 11 нельзя
analyzers: {markers: true, rhythm: true, soul: true, cards: true, structure: true, consistency: true, clarity: false}
weights: {живое: 0.30, ритм: 0.25, чистота: 0.15, названия: 0.10, согласованность: 0.10, структура: 0.10}
