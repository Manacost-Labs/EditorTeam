id: constructed-guide
title: Гайд по архетипу в конструированных режимах
description: "Разбор колоды: сборки, декбилдинг, муллиган, стратегия, матч-апы"
min_words: 600
sections:
  # purpose — назначение раздела одной строкой, снято с оглавлений корпуса;
  # min_words — нижняя граница тела раздела (в корпусе только 4% тел короче 60 слов).
  # Оба поля читает скелет переплавки и глубокая проверка структуры.
  required:
    - {id: builds, title: Сборки, variants: [сборки архетипа, сборки, топовые сборки, списки колод], corpus_share: 98, min_words: 60,
       purpose: "две-три актуальные сборки, чем они отличаются и какую брать для ладдера"}
    - {id: deckbuilding, title: Декбилдинг, variants: [вопросы декбилдинга, как собрать колоду, основа колоды, замены, опциональные и технические карты], corpus_share: 98, min_words: 60,
       purpose: "основа колоды; чем её дополняют; замены дорогих карт; бюджетная версия"}
    - {id: mulligan, title: Муллиган, variants: [муллиган, общие правила муллигана, муллиган против каждого класса], corpus_share: 100, min_words: 60,
       purpose: "что оставлять всегда; что против агро и против контроля; чего не держать"}
    - {id: strategy, title: Стратегия, variants: [стратегия игры, основы геймплея, как работает колода, тонкости геймплея, способы победы, полезные советы], corpus_share: 96, min_words: 60,
       purpose: "как колода выигрывает по стадиям игры; ключевые комбинации; полезные советы"}
    - {id: matchups, title: Матч-апы, variants: [матч-апы, матчапы, матч-апы колоды], corpus_share: 100, min_words: 60,
       purpose: "каждый класс из исходника: как победить, чего бояться, что держать в руке"}
  optional:
    - {id: conclusion, title: Заключение, variants: [заключение], corpus_share: 27,
       purpose: "короткий итог и подпись; без прогнозов"}
matchups:
  require_classes: true
  classes: 11                     # в корпусе все 11 есть лишь в 6 гайдах из 49: охват считается по классам исходника
opening:
  requires: [archetype, expansion]
  formula: "Герой гайда — <архетип> в <дополнение>"   # 30 гайдов из 49; ориентир, не требование
  promise: true                                       # абзац-обещание «Гайд расскажет… Вы найдёте…», 30 из 49
closing:
  signature: "Спасибо за внимание"                    # 30 гайдов из 49
analyzers: {markers: true, rhythm: true, soul: true, cards: true, structure: true, consistency: true, clarity: false}
weights: {живое: 0.30, ритм: 0.25, чистота: 0.15, названия: 0.10, согласованность: 0.10, структура: 0.10}
