id: battlegrounds-article
title: Статья о Полях сражений для игроков
description: "Аналитическая статья для обычного игрока: понятный тезис, русские игровые термины и объяснение последствий без перегруза"
min_words: 400
sections:
  required: []
  optional:
    # purpose — назначение раздела одной строкой: что читатель должен унести из него
    - {id: summary, title: Обзор меты, variants: [обзор меты, состояние меты, что происходит], min_words: 80,
       purpose: "какие стратегии и герои сильнее сейчас и за счёт чего; без таблиц и оценочных букв"}
    - {id: changes, title: Изменения, variants: [изменения, что поменялось, движение], min_words: 60,
       purpose: "что поменялось в патче и как это сдвинуло силу стратегий"}
    - {id: conclusion, title: Вывод, variants: [вывод, заключение, что это значит],
       purpose: "вывод одной-двумя фразами: что это значит для игрока; без прогнозов"}
# зачин статьи — тезис: проблема и её последствие в первых 4 абзацах
# (маркеры и порог — config/editorial.yaml, проверка clarity.thesis.missing)
opening:
  requires: [thesis]
matchups: {require_classes: false}
analyzers: {markers: true, rhythm: true, soul: true, cards: true, structure: true, consistency: true, clarity: true}
weights: {живое: 0.25, ритм: 0.20, чистота: 0.15, названия: 0.10, согласованность: 0.10, понятность: 0.20}
note: "Публичный аналитический материал, а не исследовательский отчёт и не пошаговый гайд"
