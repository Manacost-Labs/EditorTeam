# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "EditorTeam: deterministic baseline/candidate evaluation"
prompts:
  - id: file://prompts/baseline.txt
    label: baseline
  - id: file://prompts/candidate.txt
    label: candidate
providers:
  - id: file://providers/editorteam.js
    label: EditorTeam eval provider
tests: file://cases/cases.json
defaultTest:
  assert:
    - type: javascript
      value: file://assertions/deterministic.js
      metric: deterministic-guardrails
