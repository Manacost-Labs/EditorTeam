# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Редакторский набор (evals/cases/editorial.json): настоящие абзацы корпуса
# без дефектов, те же абзацы с внесёнными дефектами и помеченные synthetic
# кейсы WoW/LoL. Candidate через production pipeline без retrieval и с ним.
#   npx promptfoo eval -c evals/promptfooconfig.editorial.yaml -o /tmp/editorial.json
#   node evals/report.js /tmp/editorial.json
description: "EditorTeam: editorial quality set, candidate without vs with retrieval"
prompts:
  - id: file://prompts/candidate.txt
    label: candidate
providers:
  - id: file://providers/pipeline-e2e.js
    label: "candidate без retrieval"
    config:
      retrieval: "off"
  - id: file://providers/pipeline-e2e.js
    label: "candidate с retrieval"
    config:
      retrieval: "on"
tests: file://cases/editorial.js
defaultTest:
  options:
    provider: "{{ env.EDITOR_EVAL_JUDGE_PROVIDER }}"
  assert:
    - type: javascript
      value: file://assertions/deterministic.js
      metric: deterministic-guardrails
    - type: llm-rubric
      value: file://assertions/judge/voice.txt
      metric: judge-voice
      weight: 0
    - type: llm-rubric
      value: file://assertions/judge/naturalness.txt
      metric: judge-naturalness
      weight: 0
    - type: llm-rubric
      value: file://assertions/judge/clarity.txt
      metric: judge-clarity
      weight: 0
    - type: llm-rubric
      value: file://assertions/judge/usefulness.txt
      metric: judge-usefulness
      weight: 0
    - type: llm-rubric
      value: file://assertions/judge/facts.txt
      metric: judge-facts
      weight: 0
    - type: llm-rubric
      value: file://assertions/judge/example-copying.txt
      metric: judge-example-copying
      weight: 0
