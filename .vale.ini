StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = EditorTeam
# Direct quotes in guillemets or straight quotes and card names in quotes are
# not editorial signals. Fenced and inline code are excluded by Vale itself.
TokenIgnores = («[^»]+»), (“[^”]+”), ("[^"]+")
# Blockquotes carry someone else's words: an interview answer or a patch note.
BlockIgnores = (?m)^>[^\n]*(?:\n>[^\n]*)*

# In guides, categorical words are often justified game instructions or names
# of mechanics. Other profiles keep the low-severity editorial signals.
[*.guide.md]
EditorTeam.Overcertainty = NO
EditorTeam.Promotion = NO
EditorTeam.Intensifiers = NO

[*.news.md]
EditorTeam.Overcertainty = suggestion
EditorTeam.Promotion = suggestion
EditorTeam.Intensifiers = suggestion

[*.analysis.md]
EditorTeam.Overcertainty = suggestion
EditorTeam.Promotion = suggestion
EditorTeam.Intensifiers = suggestion

[*.meta-report.md]
EditorTeam.Overcertainty = suggestion
EditorTeam.Promotion = suggestion
EditorTeam.Intensifiers = suggestion
