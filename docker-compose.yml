services:
  languagetool:
    # community image built from official LanguageTool releases; upstream
    # documents the HTTP server rather than publishing a first-party image.
    image: erikvl87/languagetool:6.8@sha256:ef8fa12cbd485166c9ceeb7139d76d56d07707a624da6bb1fc1fbb5411750527
    restart: unless-stopped
    ports:
      - "${LANGUAGETOOL_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --data 'language=ru-RU&text=Простой+тест' http://127.0.0.1:8010/v2/check >/dev/null"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 10
    networks:
      - editor

  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
      target: analyzer
    restart: unless-stopped
    networks:
      - editor

  nlp:
    build:
      context: sidecars/nlp
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${NATASHA_BIND_ADDRESS:-127.0.0.1}:${NATASHA_PORT:-8742}:8742"
    networks:
      - editor

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    restart: unless-stopped
    environment:
      EDITOR_ADDR: ":8080"
      EDITOR_ANALYZER_URL: http://analyzer:8731
      # For provider=agui these credential fields stay empty: the internal work agent owns
      # ChatGPT authentication. Other providers still validate EDITOR_API_KEY at startup.
      EDITOR_PROVIDER: ${EDITOR_PROVIDER:-none}
      EDITOR_PROMPT_VARIANT: ${EDITOR_PROMPT_VARIANT:-candidate}
      EDITOR_MODEL: ${EDITOR_MODEL:-gpt-4o-mini}
      EDITOR_API_KEY: ${EDITOR_API_KEY:-}
      EDITOR_AGUI_URL: ${EDITOR_AGUI_URL:-}
      EDITOR_AGUI_TOKEN: ${EDITOR_AGUI_TOKEN:-}
      EDITOR_REASONING_EFFORT: ${EDITOR_REASONING_EFFORT:-xhigh}
      EDITOR_AGENT_TOKEN: ${EDITOR_AGENT_TOKEN:-}
      EDITOR_MAX_ATTEMPTS: ${EDITOR_MAX_ATTEMPTS:-3}
      EDITOR_TIMEOUT_SEC: ${EDITOR_TIMEOUT_SEC:-120}
      EDITOR_MAX_TEXT_BYTES: ${EDITOR_MAX_TEXT_BYTES:-524288}
      LANGUAGETOOL_URL: ${LANGUAGETOOL_URL:-http://languagetool:8010}
      LANGUAGETOOL_TIMEOUT_SEC: ${LANGUAGETOOL_TIMEOUT_SEC:-8}
      NATASHA_URL: ${NATASHA_URL:-http://nlp:8742}
      NATASHA_TIMEOUT_SEC: ${NATASHA_TIMEOUT_SEC:-8}
      HUNSPELL_BIN: ${HUNSPELL_BIN:-hunspell}
      RU_DICT_PATH: ${RU_DICT_PATH:-/usr/share/hunspell/ru_RU.dic}
      MARKDOWNLINT_BIN: ${MARKDOWNLINT_BIN:-markdownlint-cli2}
      MARKDOWNLINT_CONFIG: ${MARKDOWNLINT_CONFIG:-/app/config/markdownlint/.markdownlint.json}
      PROMPTFOO_CONFIG: ${PROMPTFOO_CONFIG:-/app/evals/promptfooconfig.yaml}
      EDITOR_ALLOW_UNAVAILABLE: ${EDITOR_ALLOW_UNAVAILABLE:-false}
      VALE_CONFIG: ${VALE_CONFIG:-/app/.vale.ini}
      VALE_BIN: ${VALE_BIN:-vale}
      VALE_BINARY: ${VALE_BINARY:-vale}
      VALE_TIMEOUT_SEC: ${VALE_TIMEOUT_SEC:-8}
      EDITOR_PYTHON: ${EDITOR_PYTHON:-python3}
      EDITOR_PYTHON_TIMEOUT_SEC: ${EDITOR_PYTHON_TIMEOUT_SEC:-20}
      EDITOR_PROCESS_MAX_OUTPUT: ${EDITOR_PROCESS_MAX_OUTPUT:-4194304}
    depends_on:
      analyzer:
        condition: service_healthy
      nlp:
        condition: service_healthy
      languagetool:
        condition: service_healthy
    ports:
      - "${EDITOR_BIND_ADDRESS:-172.17.0.1}:${EDITOR_PORT:-8740}:8080"
    networks:
      - editor

networks:
  editor:
