# "уникальный" alone is not an error: a unique card effect is a game fact.
# The rule fires only on advertising pairs and clichés. Guides disable it.
extends: existence
message: "Проверьте категоричную или рекламную формулировку."
level: suggestion
ignorecase: true
scope: ~heading
tokens:
  - "\\bуникальн\\p{L}*(\\s+\\p{L}+){0,3}\\s+незаменим\\p{L}*\\b"
  - "\\bнезаменим\\p{L}*(\\s+\\p{L}+){0,3}\\s+уникальн\\p{L}*\\b"
  - "\\b(мощнейш\\p{L}*|незаменим\\p{L}*)\\s+(решение|вариант|инструмент)\\b"
  - "\\bнастоящ\\p{L}*\\s+геймченджер\\b"
